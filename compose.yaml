# Base, shared config. Add compose.prod.yaml for the published image, ports and restart
# policy:  docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  musical-lights:
    build: .
    container_name: musical-lights
    env_file:
      - path: .env
        required: false
    # Lets HA_URL=http://host.docker.internal:8123 reach a Home Assistant that runs on
    # the same host with host networking (the usual HA container setup).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
